name: Delete Episodes

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list: 一覧表示 / delete: 削除実行'
        required: true
        default: 'list'
        type: choice
        options:
          - list
          - delete
      episodes:
        description: '削除する番号（カンマ区切り例: 1,3,5）。listの場合は不要'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: List episodes
        if: ${{ inputs.action == 'list' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python delete_episodes.py --list

      - name: Delete episodes
        if: ${{ inputs.action == 'delete' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python delete_episodes.py --delete "${{ inputs.episodes }}"
